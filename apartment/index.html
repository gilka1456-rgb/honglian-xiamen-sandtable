<body>
<header><div class="brand"><span class="brand-icon" aria-hidden="true"><i></i></span><div><h1>户型漫游</h1><p>厦门思明 · 洪莲中二路住宅</p></div></div><button id="info" class="quiet"><span class="info-icon">i</span> 图纸说明</button></header>
<main><section class="stage" aria-label="户型三维预览">
<div class="render" id="render"><canvas id="model" tabindex="0" aria-label="三维模型，拖动观察。室内可使用方向键或摇杆移动。"></canvas><canvas id="flat" hidden></canvas></div>
<nav class="modes" aria-label="查看方式"><button data-mode="orbit" class="active" aria-pressed="true"><span class="glyph">◇</span>全屋俯瞰</button><button data-mode="walk" aria-pressed="false"><span class="glyph">⌾</span>室内漫游</button></nav>
<div id="viewTools" class="view-tools"><button id="zoomIn" aria-label="放大" title="放大">＋</button><button id="zoomOut" aria-label="缩小" title="缩小">−</button><button id="reset" aria-label="恢复初始角度" title="恢复初始角度">⟲</button></div>
<div class="help" id="help">拖动旋转 · 滚轮缩放</div><div class="where" id="where" hidden><i></i><b id="place"></b></div>
<div id="stick" role="group" aria-label="移动摇杆" hidden><span class="arrow up">⌃</span><span class="arrow down">⌃</span><span class="arrow left">⌃</span><span class="arrow right">⌃</span><i id="knob"></i></div>
<button id="openMap" aria-expanded="false" aria-controls="panel"><span class="map-symbol">▦</span> 户型导航</button>
<div id="loading" role="status">正在打开三维户型…</div>
</section>
<div id="shade" hidden></div><aside id="panel" aria-label="户型导航"><div class="aside-head"><div><div class="sub">整套户型</div><h2>户型导航</h2></div><button id="closeMap" class="quiet" aria-label="收起户型导航">×</button></div>
<div class="mapbox"><svg id="map" aria-label="可点选房间的平面图"></svg></div>
<div class="room-head"><h3>进入房间</h3><small>点选定位</small></div><div id="rooms"></div>
<div class="measure"><div><span>图示面宽</span><strong>11.20 <small>m</small></strong></div><div><span>图示进深</span><strong>14.85 <small>m</small></strong></div></div>
</aside></main>
<dialog id="details" aria-labelledby="detailsTitle"><div class="dialog-top"><h2 id="detailsTitle">图纸说明</h2><button id="closeInfo" class="quiet" aria-label="关闭">×</button></div>
<p>本模型采用彩色平面图里完整可见的一套住宅，以图示面宽 11.20 米、进深 14.85 米为比例基准，并参照 CAD 照片核对空间关系。</p>
<p>图纸照片同时拍入“110户型”和“140户型”两个标题，无法仅凭这一页确定面积归属。面宽和进深是尺寸链，实际轮廓含凹进和阳台。</p>
<p>墙高暂按 2.80 米、漫游视点按 1.60 米设置。门窗高度、家具、饰面和窗外环境均为示意；室内房门按打开状态展示。</p></dialog>
